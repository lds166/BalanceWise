<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - BalanceWise</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="mark">账</div>
      <h2>创建账号</h2>
      <p>注册即为您初始化常用收支分类，开箱即用</p>
    </div>
    <form onsubmit="return doRegister(event)">
      <label class="field"><span>用户名</span>
        <input class="input" placeholder="4-32 位字母、数字或下划线" required>
      </label>
      <label class="field"><span>昵称（选填）</span>
        <input class="input" placeholder="怎么称呼你？">
      </label>
      <label class="field"><span>密码</span>
        <input class="input" type="password" placeholder="至少 6 位" required>
      </label>
      <label class="field"><span>确认密码</span>
        <input class="input" type="password" placeholder="再次输入密码" required>
      </label>
      <button type="submit" class="btn btn-primary">注 册</button>
    </form>
    <div class="auth-links">已有账号？<a href="login.html">直接登录</a></div>
  </div>
</div>
<div id="toast"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
function doRegister(e) {
  e.preventDefault();
  toast("注册成功，请登录");
  setTimeout(() => location.href = "login.html", 500);
  return false;
}
</script>
</body>
</html>
