<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>统计报表 - BalanceWise</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
renderLayout("stats", "统计报表");

document.getElementById("page").innerHTML = `
  <div class="card">
    <div class="filter-bar">
      <select class="input" id="rangeSel"><option>近6个月</option><option>近12个月</option><option>今年</option><option>自定义区间</option></select>
      <select class="input"><option>全部账户</option>${ACCOUNTS.map(a => `<option>${a.name}</option>`).join("")}</select>
      <button class="btn btn-primary btn-sm" onclick="toast('原型演示：筛选条件不改变图表')">应用</button>
    </div>
  </div>

  <div class="grid grid-3 mb16">
    <div class="card stat-card"><span class="label">本期收入</span><span class="value money income">+${fmt(12878.20)}</span></div>
    <div class="card stat-card"><span class="label">本期支出</span><span class="value money expense">-${fmt(6512.35)}</span></div>
    <div class="card stat-card"><span class="label">本期结余</span><span class="value" style="color:var(--primary)">${fmt(6365.85)}</span></div>
  </div>

  <div class="card">
    <h3>收支趋势
      <span>
        <button class="btn btn-sm btn-primary" id="btnMonth">按月</button>
        <button class="btn btn-sm" id="btnDay">按日</button>
      </span>
    </h3>
    <div id="trendChart" class="chart-box"></div>
  </div>

  <div class="card">
    <h3>净资产趋势</h3>
    <div id="nwChart" class="chart-box"></div>
  </div>

  <div class="grid grid-2">
    <div class="card">
      <h3>分类构成
        <span>
          <button class="btn btn-sm btn-primary" id="btnExp">支出</button>
          <button class="btn btn-sm" id="btnInc">收入</button>
        </span>
      </h3>
      <div id="catChart" class="chart-box"></div>
      <p class="muted" style="text-align:center">点击扇区可下钻二级分类（可选功能）</p>
    </div>
    <div class="card">
      <h3>账户总览</h3>
      <div id="accChart" class="chart-box"></div>
    </div>
  </div>`;

const charts = [];
function mk(id, opt) {
  if (typeof echarts === "undefined") {
    document.getElementById(id).innerHTML = '<div class="muted" style="text-align:center;padding-top:110px">📊 图表需联网加载 ECharts CDN</div>';
    const stub = { setOption() {}, resize() {} };
    charts.push(stub);
    return stub;
  }
  const c = echarts.init(document.getElementById(id));
  c.setOption(opt);
  charts.push(c);
  return c;
}

function trendOption(granularity) {
  let x, inc, exp;
  if (granularity === "month") {
    x = TREND.map(t => t.month.slice(5) + "月");
    inc = TREND.map(t => t.income);
    exp = TREND.map(t => t.expense);
  } else {
    x = Array.from({ length: 15 }, (_, i) => "10-" + String(i + 7).padStart(2, "0"));
    inc = [0,0,320,0,0,0,0,58,0,0,0,12500,0,0,0];
    exp = [210,156,0,500,72,10,430,0,245,128,2000,36,15,89,199];
  }
  return {
    tooltip: { trigger: "axis" },
    legend: { data: ["收入", "支出", "结余"], bottom: 0 },
    grid: { left: 60, right: 20, top: 30, bottom: 40 },
    xAxis: { type: "category", data: x },
    yAxis: { type: "value", axisLabel: { formatter: v => v >= 10000 ? (v / 10000) + "w" : v } },
    series: [
      { name: "收入", type: "line", smooth: true, data: inc, itemStyle: { color: "#3aa97a" }, areaStyle: { opacity: .08 } },
      { name: "支出", type: "line", smooth: true, data: exp, itemStyle: { color: "#e8604c" }, areaStyle: { opacity: .08 } },
      { name: "结余", type: "line", smooth: true, data: inc.map((v, i) => v - exp[i]), itemStyle: { color: "#4e63f2" }, lineStyle: { type: "dashed" } },
    ]
  };
}

function catOption(kind) {
  const data = kind === "expense" ? EXPENSE_DIST : [
    { name: "工资薪资", value: 12500 }, { name: "兼职副业", value: 320 },
    { name: "理财收益", value: 58.20 }, { name: "红包礼金", value: 0.01 },
  ];
  return {
    tooltip: { trigger: "item", formatter: "{b}: ¥{c}（{d}%）" },
    legend: { orient: "vertical", right: 0, top: "center", textStyle: { fontSize: 12 } },
    series: [{
      type: "pie", radius: ["45%", "70%"], center: ["38%", "50%"],
      itemStyle: { borderRadius: 6, borderColor: "#fff", borderWidth: 2 },
      label: { show: false },
      data,
      color: ["#4e63f2", "#7b5cf0", "#3aa97a", "#e8b64c", "#e8604c", "#4cb8e8", "#8a90a3", "#c9cede"],
    }]
  };
}

mk("trendChart", trendOption("month"));
mk("catChart", catOption("expense"));
mk("accChart", {
  tooltip: { trigger: "axis", axisPointer: { type: "shadow" }, formatter: p => `${p[0].name}<br/>余额：¥${Math.abs(p[0].value).toLocaleString()}${p[0].value < 0 ? "（欠款）" : ""}` },
  grid: { left: 100, right: 40, top: 10, bottom: 30 },
  xAxis: { type: "value", axisLabel: { formatter: v => (v / 10000) + "w" } },
  yAxis: { type: "category", data: ACCOUNTS.map(a => a.name).reverse() },
  series: [{
    type: "bar", data: ACCOUNTS.map(a => a.balance).reverse(),
    itemStyle: {
      borderRadius: 4,
      color: p => p.value >= 0 ? "#4e63f2" : "#e8604c",
    },
    barMaxWidth: 18,
  }]
});

/* 净资产趋势（模拟数据） */
const NET_WORTH_TREND = [
  { month: "2026-05", value: 30200 }, { month: "2026-06", value: 28900 },
  { month: "2026-07", value: 33100 }, { month: "2026-08", value: 30400 },
  { month: "2026-09", value: 33000 }, { month: "2026-10", value: 39417 },
];
mk("nwChart", {
  tooltip: { trigger: "axis", formatter: p => `${p[0].name}<br/>净资产：¥${Number(p[0].value).toLocaleString()}` },
  grid: { left: 70, right: 20, top: 30, bottom: 40 },
  xAxis: { type: "category", data: NET_WORTH_TREND.map(t => t.month.slice(5) + "月") },
  yAxis: { type: "value", axisLabel: { formatter: v => (v / 10000) + "w" } },
  series: [{
    name: "净资产", type: "line", smooth: true,
    data: NET_WORTH_TREND.map(t => t.value),
    itemStyle: { color: "#7b5cf0" },
    areaStyle: { opacity: .1 },
    symbolSize: 8,
  }]
});

document.getElementById("btnMonth").onclick = function () {
  charts[0].setOption(trendOption("month"));
  this.className = "btn btn-sm btn-primary";
  document.getElementById("btnDay").className = "btn btn-sm";
};
document.getElementById("btnDay").onclick = function () {
  charts[0].setOption(trendOption("day"));
  this.className = "btn btn-sm btn-primary";
  document.getElementById("btnMonth").className = "btn btn-sm";
};
document.getElementById("btnExp").onclick = function () {
  charts[1].setOption(catOption("expense"));
  this.className = "btn btn-sm btn-primary";
  document.getElementById("btnInc").className = "btn btn-sm";
};
document.getElementById("btnInc").onclick = function () {
  charts[1].setOption(catOption("income"));
  this.className = "btn btn-sm btn-primary";
  document.getElementById("btnExp").className = "btn btn-sm";
};

window.addEventListener("resize", () => charts.forEach(c => c.resize()));
</script>
</body>
</html>
