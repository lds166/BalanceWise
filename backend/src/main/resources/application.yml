server:
  port: 8080
spring:
  application:
    name: balancewise
  datasource:
    url: ${DB_URL:jdbc:mysql://172.16.25.128:6006/balancewisedb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Hzsun88994788}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  sql:
    init:
      mode: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
jwt:
  secret: ${JWT_SECRET:balancewise-dev-secret-key-please-change-in-production-0123456789abcdef}
  expire-hours: 72
cors:
  allowed-origins: http://localhost:5173
# AI 账单分类（OpenAI 兼容接口，默认硅基流动；换厂商只改 base-url/model）
# 运行时优先读用户级配置（个人信息页，存 ai_config 表）；此处的 api-key（环境变量 AI_API_KEY）
# 仅作为全局兜底，均未配置时自动降级为记忆+规则两层，导入不受影响
balancewise:
  ai:
    enabled: true
    base-url: https://api.siliconflow.cn/v1
    api-key: ${AI_API_KEY:}
    model: Qwen/Qwen2.5-7B-Instruct
    timeout-ms: 15000
    confidence-threshold: 0.6
    max-rows: 300
